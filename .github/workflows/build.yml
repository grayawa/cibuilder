name: GKI Build with ReSukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create and enable swapfile
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=10240 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python3 python3-pip

      - name: Install repo tool
        run: |
          mkdir -p ~/.local/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.local/bin/repo
          chmod a+x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Free up disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /opt/microsoft \
            /usr/share/miniconda \
            /usr/local/share/vcpkg \
            /home/linuxbrew \
            /usr/local/julia* \
            /usr/share/swift \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/node \
            /opt/hostedtoolcache/Python \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby
          sudo apt-get clean
          sudo docker image prune -af || true
          sudo journalctl --vacuum-size=10M
          df -h

      - name: Init and sync kernel source
        run: |
          mkdir -p kernel && cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10
          repo sync -j$(nproc) -c --no-tags

      - name: Add ReSukiSU support
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Build kernel
        working-directory: kernel
        run: |
          echo "POST_DEFCONFIG_CMDS='\${KERNEL_DIR}/scripts/config --file \${OUT_DIR}/.config --disable KASAN --module KSU && make \${TOOL_ARGS} O=\${OUT_DIR} olddefconfig'" > config-fragment.sh
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 BUILD_CONFIG_FRAGMENTS=config-fragment.sh build/build.sh

      - name: Package artifacts
        working-directory: kernel
        run: |
          DIST_DIR=$(find out -type d -name dist | head -1)
          echo "DIST_DIR=$DIST_DIR"
          ls -la "$DIST_DIR"/
          mkdir -p release
          find "$DIST_DIR" -maxdepth 1 \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.lz4' -o -name '*.ko' \) \
            -exec cp -v {} release/ \;
          tar -czf gki-kernelsu.tar.gz -C release .
          echo "Packaged contents:"
          tar -tzf gki-kernelsu.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernelsu
          path: kernel/gki-kernelsu.tar.gz

