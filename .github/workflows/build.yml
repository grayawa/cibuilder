name: ReSukiSU LKM Build (Oculus Quest 3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup env, install deps and clone sources (parallel)
        run: |
          # git-lfs is preinstalled on the runner; ensure the smudge filter is set
          git lfs install

          # Disk cleanup in background (free space for the large clang toolchain)
          (
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/powershell \
              /usr/local/share/chromium /usr/local/lib/node_modules /opt/microsoft \
              /usr/share/miniconda /usr/local/share/vcpkg /home/linuxbrew \
              /usr/local/julia* /usr/share/swift /opt/hostedtoolcache/go \
              /opt/hostedtoolcache/node /opt/hostedtoolcache/Python \
              /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby
            sudo apt-get clean
            sudo journalctl --vacuum-size=10M
          ) &
          P_CLEAN=$!

          # Swapfile in background (dd of 10GB takes time)
          (
            sudo swapoff /swapfile 2>/dev/null || true
            sudo rm -f /swapfile
            sudo dd if=/dev/zero of=/swapfile bs=1M count=10240 status=progress
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          ) &
          SWAP_PID=$!

          mkdir -p kernel && cd kernel

          # All independent work in parallel:
          # 1) Oculus Quest 3 kernel source (device build 5227074.3810.520 = commit 8f32bdea)
          ( git clone --depth=1 -b oculus-quest3-kernel-master \
              https://github.com/facebookincubator/oculus-linux-kernel.git common \
            && git -C common fetch --depth=1 origin 8f32bdea05abf85dd10d6202963f7e9bdc55c717 \
            && git -C common checkout FETCH_HEAD ) &
          P_OCULUS=$!
          # 2) clang 14 prebuilt (sparse + git lfs pull to materialize the real binaries)
          (
            git clone --depth=1 --sparse -b llvm-r450784 \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang \
            && git -C clang sparse-checkout set clang-r450784c \
            && git -C clang lfs pull
          ) &
          P_CLANG=$!
          # 3) ReSukiSU (off-tree module source)
          ( git clone --depth=1 https://github.com/ReSukiSU/ReSukiSU KernelSU ) &
          P_KSU=$!
          # 4) Build dependencies (git-lfs already installed above)
          ( sudo apt-get update && sudo apt-get install -y git gnupg flex bison build-essential \
              zip curl zlib1g-dev libc6-dev-i386 libncurses-dev libgl1-mesa-dev libxml2-utils \
              xsltproc unzip python3 device-tree-compiler llvm-15 ) &
          P_APT=$!

          # Wait for each job individually so a failure in any one is not masked
          wait $P_CLEAN || exit 1
          wait $P_OCULUS || exit 1
          wait $P_CLANG || exit 1
          wait $P_KSU || exit 1
          wait $P_APT || exit 1
          wait $SWAP_PID || exit 1

          # Verify the clang toolchain was materialized by the sparse checkout
          CLANG_BIN=$PWD/clang/clang-r450784c/bin
          if [ -z "$CLANG_BIN" ] || [ ! -x "$CLANG_BIN/clang" ]; then
            echo "clang toolchain not materialized. Contents of clang/:"
            ls -la $PWD/clang/ 2>/dev/null || true
            exit 1
          fi
          echo "CLANG_BIN=$CLANG_BIN"
          echo "$CLANG_BIN" >> $GITHUB_PATH
          export PATH="$CLANG_BIN:$PATH"
          clang --version
          ld.lld --version

      - name: Add ReSukiSU, configure and build kernel
        working-directory: kernel
        run: |
          export PATH="$PWD/clang/clang-r450784c/bin:$PATH"

          # Add ReSukiSU Kconfig to kernel tree, but keep the module itself off-tree
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          sed -i '/obj-\$(CONFIG_KSU) += kernelsu\//d' common/drivers/Makefile

          # Kernel config: minimal GKI (no QCOM/Meta vendor drivers), match device vermagic
          sed -i '/CONFIG_KASAN/d; /CONFIG_KSU/d' common/arch/arm64/configs/gki_defconfig
          echo '# CONFIG_KASAN is not set' >> common/arch/arm64/configs/gki_defconfig
          echo 'CONFIG_KSU=m' >> common/arch/arm64/configs/gki_defconfig
          echo 'CONFIG_LOCALVERSION="-g9cb2f620a9a8"' >> common/arch/arm64/configs/gki_defconfig
          echo '# CONFIG_LOCALVERSION_AUTO is not set' >> common/arch/arm64/configs/gki_defconfig
          sed -i 's/echo "+"/echo ""/g' common/scripts/setlocalversion

          # Build kernel to vmlinux (CC=clang resolves Kconfig; thin LTO is faster; skip dtbs)
          make -C common O=$PWD/out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- LTO=thin gki_defconfig
          make -C common O=$PWD/out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- LTO=thin vmlinux -j$(nproc)

      - name: Build ReSukiSU off-tree and package
        working-directory: kernel
        run: |
          export PATH="$PWD/clang/clang-r450784c/bin:$PATH"

          make -C common O=$PWD/out ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            M=$PWD/KernelSU/kernel src=$PWD/KernelSU/kernel modules KBUILD_MODPOST_WARN=1 -j$(nproc)

          mkdir -p output
          cp KernelSU/kernel/kernelsu.ko output/kernelsu.ko
          llvm-strip-15 -d output/kernelsu.ko || true
          ls -la output/

      - name: Upload kernelsu.ko
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-ko
          path: output/kernelsu.ko

      - name: Debug via tmate (on failure)
        if: failure()
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
