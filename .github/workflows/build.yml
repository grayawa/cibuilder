name: GKI Build with ReSukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Create swapfile, install dependencies and repo
        run: |
          # Create swapfile in background (dd of 10GB takes time)
          (
            sudo swapoff /swapfile 2>/dev/null || true
            sudo rm -f /swapfile
            sudo dd if=/dev/zero of=/swapfile bs=1M count=10240 status=progress
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            sudo swapon --show
          ) &
          SWAP_PID=$!

          # Install dependencies
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python3 python3-pip llvm-15
          pip install ast-grep-cli

          # Install repo tool
          mkdir -p ~/.local/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.local/bin/repo
          chmod a+x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          wait $SWAP_PID

      - name: Free up disk space and sync kernel source
        run: |
          # Start disk cleanup in background
          (
            sudo rm -rf \
              /usr/share/dotnet \
              /usr/local/lib/android \
              /opt/ghc \
              /opt/hostedtoolcache/CodeQL \
              /usr/local/.ghcup \
              /usr/local/share/powershell \
              /usr/local/share/chromium \
              /usr/local/lib/node_modules \
              /opt/microsoft \
              /usr/share/miniconda \
              /usr/local/share/vcpkg \
              /home/linuxbrew \
              /usr/local/julia* \
              /usr/share/swift \
              /opt/hostedtoolcache/go \
              /opt/hostedtoolcache/node \
              /opt/hostedtoolcache/Python \
              /opt/hostedtoolcache/PyPy \
              /opt/hostedtoolcache/Ruby
            sudo apt-get clean
            sudo docker image prune -af || true
            sudo journalctl --vacuum-size=10M
          ) &
          CLEANUP_PID=$!

          # Init and sync build system + toolchain from ACK manifest
          mkdir -p kernel && cd kernel
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-2025-09 --repo-rev=v2.16
          repo sync -c -j$(nproc) --no-tags

          # Replace ACK common with Oculus Quest 3 kernel source
          rm -rf common
          git clone --depth=1 -b oculus-quest3-kernel-master https://github.com/facebookincubator/oculus-linux-kernel.git common

          wait $CLEANUP_PID
          df -h

      - name: Add ReSukiSU support
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Setup for LKM
        working-directory: kernel
        run: |
          ast-grep -U -p '$$$ check_exports($$$) {$$$}' -r '' common/scripts/mod/modpost.c
          ast-grep -U -p 'check_exports($$$);' -r '' common/scripts/mod/modpost.c
          sed -i '/config KSU/,/help/{s/default y/default m/}' common/drivers/kernelsu/Kconfig
          grep -q 'drivers/kernelsu/kernelsu.ko' common/android/gki_aarch64_modules 2>/dev/null || echo 'drivers/kernelsu/kernelsu.ko' >> common/android/gki_aarch64_modules

      - name: Prepare kernel config
        working-directory: kernel
        run: |
          sed -i '/CONFIG_KASAN/d; /CONFIG_KSU/d' common/arch/arm64/configs/gki_defconfig
          echo '# CONFIG_KASAN is not set' >> common/arch/arm64/configs/gki_defconfig
          echo 'CONFIG_LOCALVERSION="-g9cb2f620a9a8"' >> common/arch/arm64/configs/gki_defconfig
          echo '# CONFIG_LOCALVERSION_AUTO is not set' >> common/arch/arm64/configs/gki_defconfig
          make -C common O=$PWD/out/defconfig-gen ARCH=arm64 gki_defconfig savedefconfig
          cp out/defconfig-gen/defconfig common/arch/arm64/configs/gki_defconfig

      - name: Make working directory clean to avoid dirty
        working-directory: kernel
        run: |
          rm common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          git config --global user.email "bot@resukisu.org"
          git config --global user.name "ReSukiSUBot"
          cd common/ && git add -A && git commit -a -m "Add ReSukiSU"
          git tag -a ksu -m "ReSukiSU"
          repo status

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: gki-kernel-aarch64-5.10.240
          max-size: 2G

      - name: Build kernel
        working-directory: kernel
        run: |
          # Official KernelSU build.sh patches: don't abort on unknown symbol / modules.order / ABI check
          TARGET_FILE="build/kernel/build.sh"
          [ -e "$TARGET_FILE" ] || TARGET_FILE="build/build.sh"
          sed -i 's/needs unknown symbol/Dont abort when unknown symbol/g' $TARGET_FILE || true
          sed -i 's/if ! diff -u "\${KERNEL_DIR}\/\${MODULES_ORDER}" "\${OUT_DIR}\/modules\.order"; then/if false; then/g' $TARGET_FILE || true
          sed -i 's@${ROOT_DIR}/build/abi/compare_to_symbol_list@echo@g' $TARGET_FILE || true
          sed -i 's/needs unknown symbol/Dont abort when unknown symbol/g' build/kernel/*.sh || true

          KBUILD_MODPOST_WARN=1 LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang"

      - name: Prepare artifacts
        working-directory: kernel
        run: |
          DIST_DIR=$(find out -type d -name dist | head -1)
          if [ ! -e "$DIST_DIR" ]; then
            DIST_DIR=dist
          fi
          echo "DIST_DIR=$DIST_DIR"
          ls -la "$DIST_DIR"/
          mkdir -p output
          llvm-strip-15 -d "$DIST_DIR"/kernelsu.ko
          cp -v "$DIST_DIR"/kernelsu.ko ./output/android12-5.10.240_kernelsu.ko

      - name: Upload LKM
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernelsu
          path: kernel/output/*_kernelsu.ko
