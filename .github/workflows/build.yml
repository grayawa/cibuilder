name: GKI Build with ReSukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create swapfile, install dependencies and repo
        run: |
          # Create swapfile in background (dd of 10GB takes time)
          (
            sudo swapoff /swapfile 2>/dev/null || true
            sudo rm -f /swapfile
            sudo dd if=/dev/zero of=/swapfile bs=1M count=10240 status=progress
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            sudo swapon --show
          ) &
          SWAP_PID=$!

          # Install dependencies
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python3 python3-pip

          # Install repo tool
          mkdir -p ~/.local/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.local/bin/repo
          chmod a+x ~/.local/bin/repo
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          wait $SWAP_PID

      - name: Free up disk space and sync kernel source
        run: |
          # Start disk cleanup in background
          (
            sudo rm -rf \
              /usr/share/dotnet \
              /usr/local/lib/android \
              /opt/ghc \
              /opt/hostedtoolcache/CodeQL \
              /usr/local/.ghcup \
              /usr/local/share/powershell \
              /usr/local/share/chromium \
              /usr/local/lib/node_modules \
              /opt/microsoft \
              /usr/share/miniconda \
              /usr/local/share/vcpkg \
              /home/linuxbrew \
              /usr/local/julia* \
              /usr/share/swift \
              /opt/hostedtoolcache/go \
              /opt/hostedtoolcache/node \
              /opt/hostedtoolcache/Python \
              /opt/hostedtoolcache/PyPy \
              /opt/hostedtoolcache/Ruby
            sudo apt-get clean
            sudo docker image prune -af || true
            sudo journalctl --vacuum-size=10M
          ) &
          CLEANUP_PID=$!

          # Init and sync kernel source
          mkdir -p kernel && cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -j$(nproc) -c --no-tags

          wait $CLEANUP_PID
          df -h

      - name: Add ReSukiSU support
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Build kernel
        working-directory: kernel
        run: |
          sed -i '/CONFIG_KASAN/d; /CONFIG_KSU/d' common/arch/arm64/configs/gki_defconfig
          echo '# CONFIG_KASAN is not set' >> common/arch/arm64/configs/gki_defconfig
          echo 'CONFIG_KSU=m' >> common/arch/arm64/configs/gki_defconfig
          make -C common O=$PWD/out/defconfig-gen ARCH=arm64 gki_defconfig savedefconfig
          cp out/defconfig-gen/defconfig common/arch/arm64/configs/gki_defconfig
          grep -q 'drivers/kernelsu/kernelsu.ko' common/android/gki_aarch64_modules 2>/dev/null || echo 'drivers/kernelsu/kernelsu.ko' >> common/android/gki_aarch64_modules
          printf '. ${ROOT_DIR}/${COMMON_KERNEL_DIR}/build.config.gki.aarch64\nKMI_ENFORCED=0\n' > build.config.ksu
          KBUILD_MODPOST_WARN=1 LTO=thin BUILD_CONFIG=build.config.ksu build/build.sh

      - name: Package artifacts
        working-directory: kernel
        run: |
          DIST_DIR=$(find out -type d -name dist | head -1)
          echo "DIST_DIR=$DIST_DIR"
          ls -la "$DIST_DIR"/
          mkdir -p release
          find "$DIST_DIR" -maxdepth 1 \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.lz4' -o -name '*.ko' \) \
            -exec cp -v {} release/ \;
          tar -czf gki-kernelsu.tar.gz -C release .
          echo "Packaged contents:"
          tar -tzf gki-kernelsu.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernelsu
          path: kernel/gki-kernelsu.tar.gz

